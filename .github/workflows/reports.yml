name: "Fast Forward Reports"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Caller permissions cap the callee; only its isolated deploy job writes Pages.
permissions:
  contents: read
  pages: write # Allows the callee's isolated main-only Pages deployment.
  id-token: write # Allows OIDC authentication for that Pages deployment.

jobs:
  reports:
    uses: php-fast-forward/dev-tools/.github/workflows/reports-native.yml@main
